name: Betterfly
description: 'Betterfly is a Latin American insurtech and employee-benefits platform
  that combines voluntary insurance coverage with daily health engagement and rewards.
  Its integrated benefits product serves three audiences — brokers, employers, and
  employees — pairing guaranteed-issue life and health insurance with wellness programs,
  health assessments, and engagement mechanics so that employees actively use their
  benefits and employers gain visibility into participation and ROI. Founded in Chile,
  Betterfly operates across the region and is backed by QED Investors. This profile
  was surfaced from the QED Investors portfolio and enriched by the API Evangelist
  pipeline; Betterfly publishes no public developer or API surface as of this pass.'
